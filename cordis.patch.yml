# Microsandbox VM execution ALONGSIDE the host world.
# Adds a vm_bash tool that runs untrusted code in an isolated microVM with a
# persistent /workspace volume. The host bash/fs/sandbox tools stay untouched.
# Plugin entries are self-contained bundles under ./dist (esbuild); their
# external deps (@deepseek-ai/cordis, dsh-tools, schemastery, microsandbox)
# resolve from this bundle's npm dependencies.
- insert:
    - id: microsandbox
      name: ./dist/microsandbox.js
      config:
        image: debian
        cwd: /workspace
        timeoutMs: 180000
        volume: dsh-web-workspace
        lazy: true
    - id: tool-microsandbox
      name: ./dist/tool.js
